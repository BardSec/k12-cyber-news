<!doctype html>
<!-- Source for the K12 Cyber Watch weekly newsletter header.
     Render to PNG with:  ./render.sh   (1456x485, 2x Substack's 728px post width) -->
<html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1456px; height: 485px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: #363737;
    background: #ffffff;
    position: relative;
  }
  /* faint dot grid on the right, fading toward the text */
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(#1d4ed8 2px, transparent 2.5px);
    background-size: 36px 36px;
    opacity: .13;
    -webkit-mask-image: linear-gradient(90deg, transparent 45%, #000 85%);
  }
  /* cream panel behind the badge */
  .panel {
    position: absolute; left: 0; top: 0; bottom: 22px; width: 430px;
    background: #f3f1ec;
  }
  .badge {
    position: absolute; left: 65px; top: 66px; width: 300px; height: 300px;
  }
  .text { position: absolute; left: 500px; top: 0; bottom: 22px; right: 80px;
          display: flex; flex-direction: column; justify-content: center; }
  .eyebrow {
    font-size: 26px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    color: #6b6b6b; display: flex; align-items: center; gap: 16px;
  }
  .eyebrow::before { content: ""; width: 44px; height: 6px; background: #FD5353; border-radius: 3px; }
  h1 { font-size: 112px; font-weight: 800; letter-spacing: -.025em; line-height: 1.02; margin: 18px 0 20px; }
  h1 span { color: #1d4ed8; }
  .sub { font-size: 36px; color: #4a4a4a; }
  .url { margin-top: 26px; font-size: 28px; font-weight: 700; color: #1d4ed8; letter-spacing: .01em; }
  /* accent stripe along the bottom, matching the site header */
  .stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 22px;
            background: linear-gradient(90deg, #1d4ed8, #3b82f6); }
</style></head><body>
  <div class="grid"></div>
  <div class="panel"></div>
  <img class="badge" src="badge-500.png" alt="">
  <div class="text">
    <div class="eyebrow">EdTech IRL · Weekly</div>
    <h1>K12 <span>Cyber</span> Watch</h1>
    <div class="sub">The week's cybersecurity news for school districts</div>
    <div class="url">news.edtechirl.com</div>
  </div>
  <div class="stripe"></div>
</body></html>
