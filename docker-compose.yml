services:
  k12-cyber-news:
    build: .
    container_name: k12-cyber-news
    restart: unless-stopped
    ports:
      - "30303:30303"
    environment:
      - NODE_ENV=production
      - PORT=30303
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:30303/api/sources"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
